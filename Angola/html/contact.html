<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MD International</title>

    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <header>
        <nav class="navbar">
            <a href="../html/home.html">HOME</a>
            <a href="../html/home.html#about">OVER ONS</a>
            <a href="../html/home.html#donate">DONATIE</a>

            <a href="index.html">
                <img src="../img/logo1.png"
                     alt="MD International Logo"
                     class="logo">
            </a>

            <a href="../html/contact.html">CONTACT</a>
            <a href="../html/blog.html">BLOG</a>
            <a href="../html/agenda.html">AGENDA</a>
        </nav>
    </header>


    <!-- HERO SECTION -->
    <section class="hero">

        <h1>
            Neem contact <br>
            met ons op
        </h1>

    </section>

     <!-- CONTACT SECTION -->

    <section class="contact-section">

        <div class="contact-container">


            <!-- LEFT SIDE: CONTACT FORM -->

            <div class="contact-form-box">

                <h2>
                    Neem gerust contact met ons op via dit formulier.
                </h2>


                <form
                    action="https://api.web3forms.com/submit"
                    method="POST"
                    class="contact-form"
                >

                    <!-- YOUR FREE ACCESS KEY -->
                    <input
                        type="hidden"
                        name="access_key"
                        value="b7067cbc-e69a-416f-820d-197799653913"
                    >

                    <!-- EMAIL SUBJECT -->
                    <input
                        type="hidden"
                        name="subject"
                        value="Nieuw bericht via MD International"
                    >

                    <!-- NAME -->
                    <input
                        type="text"
                        name="name"
                        placeholder="Naam"
                        required
                    >

                    <!-- EMAIL -->
                    <input
                        type="email"
                        name="email"
                        placeholder="E-mail"
                        required
                    >

                    <!-- MESSAGE -->
                    <textarea
                        name="message"
                        placeholder="Reactie"
                        required
                    ></textarea>

                    <!-- SUBMIT BUTTON -->
                    <button type="submit">
                        VERZEND
                    </button>

                </form>
            </div>



            <!-- RIGHT SIDE: CONTACT INFORMATION -->

            <div class="contact-info">


                <!-- EMAIL -->

                <div class="contact-info-box">

                    <div class="contact-icon">
                        <img src="../img/email.png" alt="email icon">
                    </div>

                    <a href="mailto:angolainnood@hotmail.com">
                        angolainnood@hotmail.com
                    </a>

                </div>



                <!-- PHONE -->

                <div class="contact-info-box">

                    <div class="contact-icon">
                        <img src="../img/phone.png" alt="phone icon">
                    </div>

                    <a href="tel:+31623750056">
                        +31 6 23 75 00 56
                    </a>

                </div>



                <!-- FACEBOOK -->

                <div class="contact-info-box">

                    <a href="https://www.facebook.com/HelpAngola/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="facebook-link">

                        <div class="contact-icon">
                            <img src="../img/fb.png" alt="Facebook icon">
                        </div>

                        <span>S.O.S Angola</span>

                    </a>

                </div>


            </div>

        </div>

    </section>






    <!-- ================= FOOTER ================= -->
    <footer class="main-footer"></footer>
</body>
</html>
